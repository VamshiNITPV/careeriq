server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. React Router owns the URL, so a hard refresh on /dashboard
    # must return index.html rather than 404 — the router resolves the path once
    # the bundle boots.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points at the current asset
    # hashes, and a stale copy pins users to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
