# Alembic configuration.
#
# The database URL is deliberately absent: env.py reads it from application
# settings so there is exactly one source of truth for the DSN, and so a
# connection string never sits in a committed file (ADR-014).

[alembic]
script_location = alembic

# Timestamped, slugged revision filenames. The default is a bare hash, which
# makes `ls alembic/versions` useless for understanding migration order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

# Fail rather than silently truncate an over-long slug.
truncate_slug_length = 60

[post_write_hooks]
# Autogenerated migrations get formatted like the rest of the codebase.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
